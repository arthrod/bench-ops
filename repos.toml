# The four repositories of the bench system. `path` overrides <BENCH_ROOT>/<name>.

[[repos]]
name = "ndb"
url = "https://github.com/jandira-tech/neurotic_docx_bench.git"
branch = "main"
role = "producer"
path = "/Users/arthrod/temp/T/neurotic_docx_bench"

[repos.release]
hf_repo = "arthrod/neurotic_docx_bench"
private = false  # the public record dataset (H2: visibility is checked, never assumed)
# Plan 8: run by `bench publish ndb <tag> --version X.Y.Z` in a fresh worktree of origin/main
# (.work/release-<tag>): the inputs the views read come back from the hub, pinned; the views are
# built for that version and must leave every tracked page as committed; then the stores upload.
before = [
  "uv run bench report --check",
  "uv run scripts/release_inputs.py --release-version {version}",
  "uv run scripts/release_views.py --release-version {version}",
  "uv run scripts/release_views.py --check",
  "uv run bench results upload",
]
files = [  # plan 3b: cases + speed beside the scores (results/release/ is git-ignored, written by scripts/release_views.py, PEP 723: ndb#134)
  "results/scores.json",
  "results/release/cases/index.json",
  "results/release/cases/*/*.json",
  "results/release/speed.json",
]

[[repos]]
name = "editors_trial"
url = "https://github.com/arthrod/editors_trial.git"
branch = "main"
role = "producer"
path = "/Users/arthrod/temp/T/editors_trial"

[repos.release]           # plan 6 part A: the report bundle; benchmarks.law reads it at build time
hf_repo = "arthrod/editors_trial-artifacts"
private = true           # the trial documents are not for the public dataset (H2)
files = ["out/facts.json", "out/release.json", "reports/*.md", "reports/*.docx", "?reports/figures/**"]  # figures may be absent in a given release (M1)

[[repos]]
name = "benchmarks-law"
url = "https://github.com/arthrod/benchmarks-law.git"
branch = "main"
role = "consumer"
deploy = "pnpm run deploy"

[[repos]]
name = "jubarte-app"
url = "https://github.com/arthrod/jubarte-app.git"
branch = "main"
role = "consumer"
path = "/Users/arthrod/temp/T/jubarte-redlines/.worktrees/1_jubarte-redlines/jubarte-app"
deploy = "cd jubarte-site && scripts/release.sh deploy"


# Plan 7 D3: score one jubarte release, publish ndb, pin/fetch it in jubarte-app,
# then deploy only when Arthur adds --deploy. The page/R2 command is a named
# placeholder until ndb's plan-7 renderer lands.
[pipelines.jubarte]
preflight_repo = "ndb"
publish_step = 4
deploy_step = 6
word_timeout_seconds = 30
required_ancestors = [
  "31e42a32b17744dd8b61f06ddedbbceaae49b9cf",  # ndb #102
  "1dbbdfd341976cf42bc9fed4c12645b723ef034b",  # ndb #104
]

[[pipelines.jubarte.steps]]
name = "release-info"
repo = "ndb"
run = "uv run python -m neurotic_docx_bench.jubarte_release_info {version}"

[[pipelines.jubarte.steps]]
name = "report-and-release-views"
repo = "ndb"
run = "uv run bench report && uv run scripts/release_views.py --release-version {version}"

[[pipelines.jubarte.steps]]
name = "stage-pages-and-upload-r2"
repo = "ndb"
run = "uv run bench release-pages {version} && uv run --with httpx python scripts/publish/upload_r2.py out/release-pages/{version} release/{version} && uv run --with httpx python scripts/publish/upload_r2.py out/release-pages/{version} release/{version} --verify"

[[pipelines.jubarte.steps]]
name = "publish-ndb"
repo = "ndb"
run = "bench publish ndb {tag} --version {version} --push"

[[pipelines.jubarte.steps]]
name = "bump-and-fetch-jubarte-app"
repo = "jubarte-app"
run = "bench bump ndb && bench fetch"

[[pipelines.jubarte.steps]]
name = "deploy-jubarte-app"
repo = "jubarte-app"
run = "bench deploy jubarte-app --yes"
