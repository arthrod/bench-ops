# The four repositories of the bench system. `path` overrides <BENCH_ROOT>/<name>.

[[repos]]
name = "ndb"
url = "https://github.com/jandira-tech/neurotic_docx_bench.git"
branch = "main"
role = "producer"
path = "/Users/arthrod/temp/T/neurotic_docx_bench"

[repos.release]
hf_repo = "arthrod/neurotic_docx_bench"
before = ["uv run bench report --check", "uv run bench results upload"]
files = ["results/scores.json"]

[[repos]]
name = "editors_trial"
url = "https://github.com/arthrod/editors_trial.git"
branch = "main"
role = "producer"
path = "/Users/arthrod/temp/T/editors_trial"

[repos.release]           # plan 6 part A: the report bundle; benchmarks.law reads it at build time
hf_repo = "arthrod/editors_trial-artifacts"
files = ["out/facts.json", "out/release.json", "reports/*.md", "reports/*.docx", "reports/figures/**"]

[[repos]]
name = "benchmarks-law"
url = "https://github.com/arthrod/benchmarks-law.git"
branch = "main"
role = "consumer"
path = "/Users/arthrod/temp/T/briefs_agreements/benchmarks-law"
deploy = "pnpm run deploy"

[[repos]]
name = "jubarte-app"
url = "https://github.com/arthrod/jubarte-app.git"
branch = "main"
role = "consumer"
path = "/Users/arthrod/temp/T/1_jubarte-redlines/jubarte-app"
deploy = "cd jubarte-site && scripts/release.sh deploy {version}"
