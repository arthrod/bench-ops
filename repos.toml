# The four repositories of the bench system. `path` overrides <BENCH_ROOT>/<name>.

[[repos]]
name = "ndb"
url = "https://github.com/jandira-tech/neurotic_docx_bench.git"
branch = "main"
role = "producer"
path = "/Users/arthrod/temp/T/neurotic_docx_bench"

[repos.release]
hf_repo = "arthrod/neurotic_docx_bench"
private = false  # the public record dataset (H2: visibility is checked, never assumed)
before = ["uv run bench report --check", "uv run scripts/release_views.py --check", "uv run bench results upload"]
files = [  # plan 3b: cases + speed beside the scores (results/release/ is git-ignored, written by scripts/release_views.py, PEP 723: ndb#134)
  "results/scores.json",
  "results/release/cases/index.json",
  "results/release/cases/*/*.json",
  "results/release/speed.json",
]

[[repos]]
name = "editors_trial"
url = "https://github.com/arthrod/editors_trial.git"
branch = "main"
role = "producer"
path = "/Users/arthrod/temp/T/editors_trial"

[repos.release]           # plan 6 part A: the report bundle; benchmarks.law reads it at build time
hf_repo = "arthrod/editors_trial-artifacts"
private = true           # the trial documents are not for the public dataset (H2)
files = ["out/facts.json", "out/release.json", "reports/*.md", "reports/*.docx", "?reports/figures/**"]  # figures may be absent in a given release (M1)

[[repos]]
name = "benchmarks-law"
url = "https://github.com/arthrod/benchmarks-law.git"
branch = "main"
role = "consumer"
path = "/Users/arthrod/temp/T/briefs_agreements/benchmarks-law"
deploy = "pnpm run deploy"

[[repos]]
name = "jubarte-app"
url = "https://github.com/arthrod/jubarte-app.git"
branch = "main"
role = "consumer"
path = "/Users/arthrod/temp/T/1_jubarte-redlines/jubarte-app"
deploy = "cd jubarte-site && scripts/release.sh deploy {version}"
