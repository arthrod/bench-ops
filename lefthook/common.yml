# Pulled into every linked repo through `remotes:` (see REPO-lefthook.yml). Edit here only.
# Every job must finish in seconds; nothing here waits on CI or uploads anything.
# Escape hatches: LEFTHOOK=0 git commit ... (skip all), BENCH_ALLOW_STALE=1 git commit ... (stale lock).
#
# Only pre-commit, on purpose. lefthook replaces every hook it configures; for git-lfs hooks
# (pre-push, post-*) it then runs `git lfs` only on branches whose lefthook.yml configures that
# hook, so on older branches pushes would succeed without uploading LFS objects (ndb is LFS).
# tests/test_lefthook_config.py enforces this.

pre-commit:
  parallel: true
  jobs:
    - name: size guard
      run: bench hook size-guard {staged_files}
    - name: secrets
      run: bench hook secrets {staged_files}
    - name: ledger
      # No glob, on purpose: lefthook builds globbed file lists with --diff-filter=ACMR, so a
      # glob on release/index.jsonl skips this job exactly when it is needed — a staged
      # deletion or rename (C1). `bench hook ledger` itself decides: it reads the staged blob
      # and `git diff --cached --name-status -M`, so it is cheap on every commit, in every repo.
      run: bench hook ledger
    - name: release state
      run: bench status --offline --fail-on-stale --repo .
